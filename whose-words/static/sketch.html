<style>
:root{
  --bg:#FFFFFF; --ink:#000000; --soft:#5A5A5A; --faint:#8A8A8A; --hair:#D6D6D6; --hatch:#D0D0D0; --graphite:#8A8A8A; --far:#FF3B30;
  --sans:system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.05em}

/* header: the name and the one big gesture */
header{border-bottom:1px solid var(--ink);padding:12px 20px}
.top{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:16px}
.top h1{font-size:16px;font-weight:600;margin:0;flex:1}
.walls-btn{border:1px solid var(--ink);background:none;padding:6px 12px;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.05em;white-space:nowrap}
.walls-btn[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.babel-line{max-width:760px;margin:8px auto 0;font-size:13px;color:var(--soft)}

main{flex:1;overflow-y:auto}
.col{max-width:760px;margin:0 auto;padding:28px 20px 40px;display:flex;flex-direction:column;gap:40px}

/* a turn: the question, then the reply drawn as a corridor */
.ask{margin-left:auto;width:fit-content;max-width:80%;text-align:right;margin-bottom:30px}
.ask .who{color:var(--faint)}
.ask p{margin:2px 0 0;font-size:17px;padding:8px 12px;border:1px solid var(--ink);display:inline-block;text-align:left}

.reply{position:relative}
.text{font-size:21px;line-height:2.85;margin:0;padding:0 2px}
/* one token, with a highlighter stroke in the ink of whoever's words carried it */
.w{display:inline-block;position:relative;white-space:pre;line-height:1.25;cursor:pointer;--h:14px;
   background-image:linear-gradient(transparent 52%, var(--mark, transparent) 52%, var(--mark, transparent) 92%, transparent 92%)}
/* walls sit at an even distance on every line; where other words were open, the wall breaks into openings */
.w::before,.w::after{content:"";position:absolute;left:0;right:0;height:1px;background:var(--wall, var(--ink));transition:transform .5s ease, opacity .4s}
.w::before{top:calc(-1 * var(--h))}
.w::after{bottom:calc(-1 * var(--h))}
.w:hover,.w.on{background-color:#F0F0F0}
.w.picked{outline:1px solid var(--ink);outline-offset:2px}
/* a fork: someone's words turned the path here. A notch cut through the top wall, in their ink. */
.w .notch{position:absolute;left:-1px;top:calc(-1 * var(--h) - 9px);width:3px;height:calc(var(--h) + 9px);background:var(--c)}
.w .notch::after{content:"";position:absolute;left:-3px;top:-6px;border:4.5px solid transparent;border-top:6px solid var(--c)}


/* shared inspector pieces: the hover card and the sidebar use the same parts */
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--faint);margin:0 0 4px}
.big{font-size:28px;font-weight:600;line-height:1.1;margin:0 0 6px;letter-spacing:-.01em;white-space:pre-wrap;word-break:break-word}
.meta{font-size:13px;color:var(--soft);margin:0}
.bar{display:flex;height:10px;margin:10px 0 6px;outline:1px solid var(--ink)}
.bar span{background:var(--c);min-width:2px}
.shares{list-style:none;padding:0;margin:0;font-size:14px}
.shares li{display:flex;justify-content:space-between;gap:12px;padding:1px 0}
.sw{display:inline-block;width:14px;height:4px;background:var(--c);vertical-align:middle;margin-right:6px;outline:1px solid var(--ink)}
.sec{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--faint);margin:14px 0 4px;font-weight:400}
table{border-collapse:collapse;width:100%;font-size:13.5px}
td,th{text-align:left;padding:2px 8px 2px 0;vertical-align:top}
th{font-weight:400;color:var(--faint)}
.flip{font-weight:600}
.turn .row{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;font-size:14px}
.turn .ctx{color:var(--faint)}
.turn .alone b{font-weight:600;text-decoration:line-through;text-decoration-thickness:1px;color:var(--soft)}
.turn .took b{font-weight:600;background:linear-gradient(transparent 55%, color-mix(in srgb, var(--c) 70%, transparent) 55%)}
.flag{font-size:13px;margin:10px 0 0;padding:7px 9px;border:1px solid var(--ink)}

/* the hover card: above the word in focus, transparent to the mouse so it never blocks words under it */
.hc{position:absolute;z-index:3;display:none;pointer-events:none;padding:11px 13px 12px;background:var(--bg);border:1px solid var(--ink);
    width:330px;max-width:92%;color:var(--soft)}
.hc.show{display:block}
.hc.simple{width:max-content;max-width:min(380px, 92%);font-size:14px;padding:9px 12px 10px}
.hc.simple b{color:var(--ink);font-weight:600}
.hc .hint{font-size:12px;color:var(--faint);margin:10px 0 0}
.hc .more{font-size:12px;color:var(--faint)}

/* the sidebar: hidden until a word is clicked */
.side{position:fixed;top:0;right:0;bottom:0;width:min(400px, 100%);background:var(--bg);border-left:1px solid var(--ink);z-index:10;
      transform:translateX(102%);transition:transform .25s ease;display:flex;flex-direction:column}
.side.open{transform:none}
.side .bar-top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--ink);padding:10px 14px}
.side .close{background:none;border:1px solid var(--ink);width:30px;height:30px;cursor:pointer}
.side .body{overflow-y:auto;padding:16px;flex:1}
.nb{list-style:none;padding:0;margin:0}
.nb li{padding:7px 0 7px 12px;border-top:1px solid var(--hair);position:relative;font-size:13.5px}
.nb li::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;background:var(--c)}
.nb li.other{opacity:.6}
.nb .src{font-weight:600;font-size:13px}
.nb mark{background:color-mix(in srgb, var(--c) 40%, transparent);color:inherit}

/* under each reply: the fare, who shaped it, the crowd */
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px;margin-top:16px;font-size:13px;color:var(--soft)}
.fare{display:grid;grid-template-columns:auto 120px auto;gap:4px 8px;align-items:center;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.fare .fb{height:6px;outline:1px solid var(--ink);position:relative}
.fare .fb span{position:absolute;inset:0 auto 0 0;background:var(--c)}
.lev{font-size:22px;font-weight:600;color:var(--ink);line-height:1}
.lev small{font-weight:400;color:var(--soft)}
.people{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.dot{display:inline-block;width:12px;height:3px;background:var(--c);vertical-align:middle;margin-right:4px}
.linkish{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;color:var(--soft);font-size:13px}
.crowd{margin-top:14px;padding:10px 0 0 12px;border-left:2px solid var(--hair)}
.crowd p{margin:4px 0 0;font-size:17px;line-height:1.7;color:var(--soft);padding-bottom:2px;
  background:var(--stripes) left bottom / 100% 2px no-repeat;display:inline}
.crowd[hidden]{display:none}

/* Babel: the walls open, the measure lifts, and the reply dissolves into one of all possible texts */
body.babel .text{background:repeating-linear-gradient(45deg, var(--hatch) 0 1px, transparent 1px 7px)}
body.babel .w::before{transform:translateY(-18px);opacity:0}
body.babel .w::after{transform:translateY(18px);opacity:0}
body.babel .w{background-image:none;color:var(--faint)}
body.babel .notch{display:none}

/* composer */
.dock{border-top:1px solid var(--ink);padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px))}
.dock .inner{max-width:760px;margin:0 auto}
.composer{display:flex;border:1px solid var(--ink)}
.composer textarea{flex:1;border:0;resize:none;padding:11px 12px;min-height:46px;font:inherit;outline:none}
.composer button{width:46px;border:0;border-left:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
.as{margin-top:6px;color:var(--faint)}
.note{max-width:760px;margin:0 auto;color:var(--faint);font-size:12px;padding:0 20px 8px}

@media (max-width: 600px){
  .text{font-size:19px;line-height:2.7}
  .ask{max-width:92%}
}
@media (prefers-reduced-motion: reduce){ .w::before,.w::after,.side{transition:none} }
</style>
</head>

function hoverCard(steps, i){

  document.querySelectorAll(".w").forEach(w => w.firstChild.nodeValue = on ? w.dataset.noise : w.dataset.word);
  const line = document.getElementById("babelLine"); line.hidden = !on; if (on) line.innerHTML = babelLine();
  document.querySelectorAll(".hc").forEach(h => h.classList.remove("show"));
  closeSide();
};
</script>
<script type="module">
// Design feedback, same as the main page: /sketch?feedback loads Agentation; "Send" saves to data/feedback.json.
if (new URLSearchParams(location.search).has("feedback")){
  const [{createElement}, {createRoot}, {Agentation}] = await Promise.all([import("react"), import("react-dom/client"), import("agentation")]);
  const host = document.createElement("div"); host.id = "agentation-root"; document.body.appendChild(host);
  createRoot(host).render(createElement(Agentation, {
    appName: "whose-words sketch",
    onSubmit: async (output, annotations) => {
      const r = await fetch("/api/feedback", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({output, annotations})});
      if (!r.ok) throw new Error("The server didn't save the feedback.");
    }
  }));
}
</script>
</body>
