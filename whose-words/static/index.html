<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>prototype 0.3</title>
<!-- Agentation (design feedback toolbar) loads only with ?feedback in the URL; see the end of the page. -->
<script type="importmap">{"imports":{
  "react":"https://esm.sh/react@18.3.1",
  "react/jsx-runtime":"https://esm.sh/react@18.3.1/jsx-runtime",
  "react-dom":"https://esm.sh/react-dom@18.3.1",
  "react-dom/client":"https://esm.sh/react-dom@18.3.1/client",
  "agentation":"https://esm.sh/agentation@3.1.2?external=react,react-dom"
}}</script>
<style>
:root{
  --bg:#FFFFFF; --ink:#000000; --soft:#5A5A5A; --faint:#8A8A8A; --hair:#D6D6D6; --hatch:#D0D0D0; --graphite:#8A8A8A;
  --sans:system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.05em}
.live::after{content:"_";animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* header: the name, the stream, and the one big gesture */
header{border-bottom:1px solid var(--ink);padding:12px 20px}
.top{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:16px}
.top h1{font-size:16px;font-weight:600;margin:0;flex:1}
.hbtn{border:1px solid var(--ink);background:none;padding:6px 12px;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.05em;white-space:nowrap}
.hbtn.quiet{border-color:transparent;text-decoration:underline;text-underline-offset:3px;padding:6px 4px}
.hbtn[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.babel-line{max-width:760px;margin:8px auto 0;font-size:13px;color:var(--soft)}

main{flex:1;overflow-y:auto}
.col{max-width:760px;margin:0 auto;padding:28px 20px 40px;display:flex;flex-direction:column;gap:40px}
.empty{padding-top:8vh}
.empty h2{font-size:clamp(24px,4vw,34px);font-weight:600;line-height:1.15;letter-spacing:-.015em;margin:0}

/* a turn: the question, then the reply drawn as a corridor */
.ask{margin-left:auto;width:fit-content;max-width:80%;text-align:right;margin-bottom:30px}
.ask .who{color:var(--faint)}
.ask p{margin:2px 0 0;font-size:17px;padding:8px 12px;border:1px solid var(--ink);display:inline-block;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere}
.ask .status{display:block;margin-top:5px;color:var(--faint)}
.wait{color:var(--faint);margin:0}

.reply{position:relative}
.text{font-size:21px;line-height:2.85;margin:0;padding:0 2px}
/* one token, with a highlighter stroke in the ink of whoever's words carried it */
.w{display:inline-block;position:relative;white-space:pre;line-height:1.25;cursor:pointer;--h:14px;
   background-image:linear-gradient(transparent 52%, var(--mark, transparent) 52%, var(--mark, transparent) 92%, transparent 92%)}
/* walls sit at an even distance on every line; where other words were open, the wall breaks into openings */
.w::before,.w::after{content:"";position:absolute;left:0;right:0;height:1px;background:var(--wall, var(--ink));transition:transform .5s ease, opacity .4s}
.w::before{top:calc(-1 * var(--h))}
.w::after{bottom:calc(-1 * var(--h))}
.w:hover,.w.on{background-color:#F0F0F0}
.w.picked{outline:1px solid var(--ink);outline-offset:2px}
/* a fork: someone's words turned the path here. A notch cut through the top wall, in their ink. */
.w .notch{position:absolute;left:-1px;top:calc(-1 * var(--h) - 9px);width:3px;height:calc(var(--h) + 9px);background:var(--c)}
.w .notch::after{content:"";position:absolute;left:-3px;top:-6px;border:4.5px solid transparent;border-top:6px solid var(--c)}
@media (prefers-reduced-motion: no-preference){
  .text.fresh .w{animation:arrive .35s ease-out both;animation-delay:calc(var(--k) * 14ms)}
  @keyframes arrive{from{opacity:0}to{opacity:1}}
}

/* shared inspector pieces: the hover card and the sidebar use the same parts */
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--faint);margin:0 0 4px}
.big{font-size:28px;font-weight:600;line-height:1.1;margin:0 0 6px;letter-spacing:-.01em;white-space:pre-wrap;word-break:break-word}
.meta{font-size:13px;color:var(--soft);margin:0}
.bar{display:flex;height:10px;margin:10px 0 6px;outline:1px solid var(--ink)}
.bar span{background:var(--c);min-width:2px}
.shares{list-style:none;padding:0;margin:0;font-size:14px}
.shares li{display:flex;justify-content:space-between;gap:12px;padding:1px 0}
.sw{display:inline-block;width:14px;height:4px;background:var(--c);vertical-align:middle;margin-right:6px;outline:1px solid var(--ink)}
.sec{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--faint);margin:14px 0 4px;font-weight:400}
table{border-collapse:collapse;width:100%;font-size:13.5px}
td,th{text-align:left;padding:2px 8px 2px 0;vertical-align:top}
th{font-weight:400;color:var(--faint)}
.flip{font-weight:600}
.turn .row{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;font-size:14px}
.turn .ctx{color:var(--faint)}
.turn .alone b{font-weight:600;text-decoration:line-through;text-decoration-thickness:1px;color:var(--soft)}
.turn .took b{font-weight:600;background:linear-gradient(transparent 55%, color-mix(in srgb, var(--c) 70%, transparent) 55%)}
.flag{font-size:13px;margin:10px 0 0;padding:7px 9px;border:1px solid var(--ink)}
.flag.quiet{border-color:var(--hair)}
.btn{padding:5px 10px;border:1px solid var(--ink);background:none;cursor:pointer;font-size:13px;text-decoration:none;display:inline-block}
.btn.solid{background:var(--ink);color:var(--bg)}
.err{color:var(--ink);font-size:13px;margin:6px 0 0;font-weight:600}
.err:empty{display:none}

/* the hover card: above the word in focus, transparent to the mouse so it never blocks words under it */
.hc{position:absolute;z-index:3;display:none;pointer-events:none;padding:11px 13px 12px;background:var(--bg);border:1px solid var(--ink);
    width:330px;max-width:92%;color:var(--soft)}
.hc.show{display:block}
.hc.simple{width:max-content;max-width:min(380px, 92%);font-size:14px;padding:9px 12px 10px}
.hc.simple b{color:var(--ink);font-weight:600}
.hc .hint{font-size:12px;color:var(--faint);margin:10px 0 0}
.hc .more{font-size:12px;color:var(--faint)}

/* the sidebar: hidden until a word, the fare, or the stream is clicked */
.side{position:fixed;top:0;right:0;bottom:0;width:min(400px, 100%);background:var(--bg);border-left:1px solid var(--ink);z-index:10;
      transform:translateX(102%);transition:transform .25s ease;display:flex;flex-direction:column}
.side.open{transform:none}
.side .side-top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--ink);padding:10px 14px}
.side .close{background:none;border:1px solid var(--ink);width:30px;height:30px;cursor:pointer}
.side .body{overflow-y:auto;padding:16px;flex:1}
.nb,.entries{list-style:none;padding:0;margin:0}
.nb li,.entries li{padding:7px 0 7px 12px;border-top:1px solid var(--hair);position:relative;font-size:13.5px}
.nb li::before,.entries li::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;background:var(--c)}
.nb li.other{opacity:.6}
.nb .src,.entries .src{font-weight:600;font-size:13px}
.nb mark{background:color-mix(in srgb, var(--c) 40%, transparent);color:inherit}
.entries p{margin:2px 0}
.linkbtn{background:none;border:0;padding:0;color:var(--soft);text-decoration:underline;cursor:pointer;font-size:12px}

/* under each reply: the fare, who shaped it, the user-trained response */
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px;margin-top:16px;font-size:13px;color:var(--soft)}
.told{margin:0;font-size:15px;line-height:1.6;color:var(--soft);max-width:62ch;flex-basis:100%}
.told .nm{color:var(--ink);background:linear-gradient(transparent 58%, color-mix(in srgb, var(--c) 60%, transparent) 58%)}
.fare{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.fare:hover{color:var(--ink)}
.linkish{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;color:var(--soft);font-size:13px}
.crowd{margin-top:14px;padding:10px 0 0 12px;border-left:2px solid var(--hair)}
.crowd p{margin:4px 0 0;font-size:17px;line-height:1.7;color:var(--soft);padding-bottom:2px;white-space:pre-wrap;
  background:var(--stripes) left bottom / 100% 2px no-repeat;display:inline}
.crowd[hidden]{display:none}

/* Babel: the walls open, the measure lifts, and every reply dissolves into one of all possible texts */
body.babel .text{background:repeating-linear-gradient(45deg, var(--hatch) 0 1px, transparent 1px 7px)}
body.babel .w::before{transform:translateY(-18px);opacity:0}
body.babel .w::after{transform:translateY(18px);opacity:0}
body.babel .w{background-image:none;color:var(--faint)}
body.babel .notch{display:none}

/* composer */
.dock{border-top:1px solid var(--ink);padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px))}
.dock .inner{max-width:760px;margin:0 auto}
.composer{display:flex;border:1px solid var(--ink)}
.composer textarea{flex:1;border:0;resize:none;padding:11px 12px;min-height:46px;max-height:160px;outline:none;line-height:1.4;background:none}
.composer button{width:46px;border:0;border-left:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
.composer button:disabled{background:none;color:var(--faint);cursor:default}
/* speaking instead of typing: the mic sits beside send, filled while it listens */
.composer .mic{background:none;color:var(--ink);display:grid;place-items:center}
.composer .mic[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.composer .mic[aria-pressed=true] svg{animation:listen 1.2s ease-in-out infinite}
@keyframes listen{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){ .composer .mic[aria-pressed=true] svg{animation:none} }
.who-row{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:flex-start;margin-top:8px;font-size:13px;color:var(--soft)}
.who-row label{display:flex;gap:6px;align-items:flex-start}
.who-row input[type=text]{width:150px;padding:3px 6px;border:1px solid var(--ink);background:none}
.who-row[hidden],.as[hidden]{display:none}
.as{margin:6px 0 0;color:var(--faint)}
.dock-actions{display:flex;justify-content:flex-start;margin-top:8px}
.dock-actions .linkish{font-size:13px}
.as button{background:none;border:0;padding:0;color:var(--faint);text-decoration:underline;cursor:pointer;font:inherit;letter-spacing:inherit}

@media (max-width: 600px){
  .text{font-size:19px;line-height:2.7}
  .ask{max-width:92%}
  .top{gap:8px}
}
@media (prefers-reduced-motion: reduce){ .w::before,.w::after,.side{transition:none} }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>prototype 0.3</h1>
    <button class="hbtn quiet" id="streamBtn" type="button">stream</button>
    <button class="hbtn" id="walls" type="button" aria-pressed="false">Babel-space</button>
  </div>
  <p class="babel-line" id="babelLine" hidden></p>
</header>

<main id="main"><div class="col" id="log">
  <section class="empty" id="empty"><h2>Hi there, say anything or ask me anything. Tell me a story, or share a hot take.</h2></section>
</div></main>

<div class="dock">
  <div class="inner">
    <form class="composer" id="composer">
      <textarea id="msg" rows="1" maxlength="1000" placeholder="Say something…" aria-label="Message" autocomplete="off"></textarea>
      <button class="mic" id="micBtn" type="button" aria-label="Speak" aria-pressed="false" title="Speak instead of typing">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="5.5" y="1.5" width="5" height="8.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M3 7.5a5 5 0 0 0 10 0M8 12.5v2.5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
      <button id="sendBtn" type="submit" aria-label="Send" disabled>↑</button>
    </form>
    <div class="dock-actions"><button class="linkish" id="takeBtn" type="button" hidden>take this moment with you</button></div>
    <div class="who-row" id="whoRow">
      <label>Name <input id="name" type="text" maxlength="24" autocomplete="off"></label>
      <label><input id="consent" type="checkbox"> My messages will be stored, trained into the model, and shown with my name to anyone using this. This data will not be used for any other purpose.</label>
    </div>
    <p class="as mono" id="asLine" hidden>writing as <span id="asName"></span> · <button type="button" id="change">change</button></p>
    <p class="err" id="sendErr" role="alert"></p>
  </div>
</div>

<aside class="side" id="side" aria-label="Details" aria-hidden="true">
  <div class="side-top"><span class="mono" id="sideTitle">word</span><button class="close" id="sideClose" type="button" aria-label="Close">✕</button></div>
  <div class="body" id="sideBody"></div>
</aside>

<script>
const INKS = ["#6EC6FF","#FF8FC7","#7EE0A1","#FFD166","#B39DFF","#FFA06B","#5FD3D0","#FF7A85"];
const $ = id => document.getElementById(id);
let S = null, V = 262145, busy = false, lastMsg = "", traceTimer = null;
const inks = {};
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
};
const ink = u => u === "parametric" ? "var(--graphite)" : (inks[u] = inks[u] || INKS[Object.keys(inks).length % INKS.length]);
const label = u => u === "parametric" ? "The model itself" : u;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const show = s => esc((s.trim() || s).replace(/\n/g, "⏎"));
const pct = x => (x * 100 >= 10 || x === 0 ? Math.round(x * 100) : (x * 100).toFixed(1)) + "%";
const bits = p => -Math.log2(Math.max(p, 1e-300));
const fmt = b => (b >= 100 ? Math.round(b) : b.toFixed(1)) + " bits";
const babel = () => document.body.classList.contains("babel");

async function api(path, opts={}){
  const r = await fetch(path, {headers:{"Content-Type":"application/json"}, ...opts});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof j.detail === "string" ? j.detail : "The server returned an error (" + r.status + ").");
  return j;
}

// ---------- one word of a memory reply, from the server's step ----------
function fromApi(s){
  const votes = {};
  s.neighbors.forEach(n => { if (n.weight > 0){ const v = votes[n.value_id] = votes[n.value_id] || {}; v[n.user_id] = (v[n.user_id] || 0) + n.weight } });
  const pusher = id => { const v = votes[id]; return v ? Object.entries(v).sort((a,b) => b[1]-a[1])[0][0] : null };
  const lm = s.lm_top5[0];
  return {t: s.text, p: s.p_final, plm: s.p_lm, open: s.open95, sh: s.shares,
    doors: s.final_top5.filter(d => d.id !== s.token_id).slice(0, 3).map(d => [d.text, d.p, pusher(d.id)]),
    alone: lm.id !== s.token_id ? lm.text : null, weak: s.weak_match, near: (s.nearest_d2_over_temp || 0).toFixed(1),
    cf: Object.fromEntries(Object.entries(s.counterfactual || {}).map(([u, c]) => [u, [c.p_chosen, c.top_text, c.flips]])),
    nb: s.neighbors.map(n => ({u: n.user_id, v: n.value_text, b: n.context_before.slice(-90), a: n.context_after.slice(0, 40),
      w: n.weight, ok: n.supports_chosen, f: n.filtered})),
    lm5: s.lm_top5.map(x => [x.text, x.p]), fin5: s.final_top5.map(x => [x.text, x.p])};
}

const peopleOf = sh => Object.entries(sh).filter(([u]) => u !== "parametric").sort((a,b) => b[1]-a[1]);
const peopleShare = s => peopleOf(s.sh).reduce((t,[,v]) => t+v, 0);
const isFork = s => s.alone != null && peopleOf(s.sh).length > 0;
// A word people influenced: a visible share of its probability came from them, or their words turned the path here.
const influenced = s => peopleShare(s) >= 0.05 || isFork(s);

// Walls: solid where only one word was really possible; broken into openings as more words were open
// (log scale, fully broken at 100 or more). Babel, where every word is open, is the "Babel-space" view.
function wall(open){
  const g = open <= 1 ? 0 : 0.18 + 0.67 * Math.min(1, Math.log(open) / Math.log(100)), dash = (8 * (1 - g)).toFixed(1);
  return g ? `repeating-linear-gradient(to right, var(--ink) 0 ${dash}px, transparent ${dash}px 8px)` : "var(--ink)";
}
function mark(s){
  // A highlighter stroke in the ink of whoever's words carried most of this word, stronger the bigger the people's share.
  const share = peopleShare(s);
  return share < 0.05 ? "transparent" : `color-mix(in srgb, ${ink(peopleOf(s.sh)[0][0])} ${Math.round(25 + 60 * share)}%, transparent)`;
}
function noise(word, seed){ let s = seed * 7919 + 17, o = ""; for (const ch of word){ s = (s * 48271) % 2147483647; o += /\s/.test(ch) ? ch : "abcdefghijklmnopqrstuvwxyz,. "[s % 29] } return o }
// Replies use markdown; show it as plain prose: drop bold markers, turn list stars into bullets.
const plain = part => part.replace(/\*\*/g, "").replace(/^(\s*)\*(\s)/, "$1•$2");

// ---------- pieces both inspectors use ----------
const sharesSorted = s => Object.entries(s.sh).sort((a,b) => a[0] === "parametric" ? -1 : b[0] === "parametric" ? 1 : b[1]-a[1]);
const bar = s => `<div class="bar">${sharesSorted(s).map(([u,v]) => `<span style="--c:${ink(u)};flex:${v}" title="${esc(label(u))} ${pct(v)}"></span>`).join("")}</div>`;
const shareRows = rows => `<ul class="shares">${rows.map(([u,v]) => `<li><span><span class="sw" style="--c:${ink(u)}"></span>${esc(label(u))}</span><span>${pct(v)}</span></li>`).join("")}</ul>`;
function cfRows(s, n){
  // "Without each person", most consequential first: anyone whose removal changes the word, then the biggest drop.
  const rows = Object.entries(s.cf).map(([u, [pc, top, flips]]) => ({u, pc, top, flips, d: s.p - pc}))
    .sort((a,b) => (b.flips - a.flips) || (b.d - a.d));
  const shown = n ? rows.filter(r => r.flips || Math.abs(r.d) >= 0.005).slice(0, n) : rows;
  if (!shown.length) return "";
  return `<table><tr><th>Removed</th><th>This word</th><th>Would write</th></tr>${shown.map(r =>
    `<tr><td><span class="sw" style="--c:${ink(r.u)}"></span>${esc(r.u)}</td><td>${pct(s.p)} to ${pct(r.pc)}</td><td class="${r.flips ? "flip" : ""}">${show(r.top)}${r.flips ? " (changes)" : ""}</td></tr>`).join("")}</table>`;
}
function turnRows(steps, i){
  // The turn, side by side: a few words of context, then what the model alone would have said and what was said.
  const s = steps[i], ctx = esc(plain(steps.slice(Math.max(0, i - 4), i).map(x => x.t).join("")).replace(/\n/g, " ").trimStart());
  const people = peopleOf(s.sh), names = people.slice(0, 2).map(([u]) => esc(u)).join(" and ");
  return `<div class="turn"><div class="row alone"><span class="mono">model alone</span><span><span class="ctx">…${ctx}</span><b>${esc(s.alone)}</b></span></div>
    <div class="row took" style="--c:${ink(people[0][0])}"><span class="mono">with ${names}</span><span><span class="ctx">…${ctx}</span><b>${esc(s.t)}</b></span></div></div>`;
}
const chosenLine = s => `Chosen with probability ${pct(s.p)}, a price of ${fmt(bits(s.p))}. The model alone gave it ${pct(s.plm)}.`;
function alternatives(s){
  const alts = s.doors.filter(d => d[1] >= 0.02).map(d => `“${show(d[0])}”`);
  return s.open <= 1 || !alts.length ? "No other word was really possible here."
    : `It could also have been ${alts.length > 1 ? alts.slice(0, -1).join(", ") + " or " + alts[alts.length-1] : alts[0]}${s.open - 1 > alts.length ? `, among ${s.open - 1} other words` : ""}.`;
}

// ---------- hover card ----------
function hoverCard(steps, i){
  const s = steps[i];
  if (!influenced(s)) return {simple: true, html: `<b>${show(s.t)}</b> is the model's own word. ${alternatives(s)} It cost ${fmt(bits(s.p))}. <span class="more">Click the word for more.</span>`};
  // Like the inspector, but only the most influential: the model plus the top two people, and the three removals that matter most.
  const rows = sharesSorted(s), top = rows.slice(0, 3), rest = rows.length - top.length, cf = cfRows(s, 3);
  return {simple: false, html: `<p class="lbl">${isFork(s) ? "the path turned here" : "from memory"}</p>
    <p class="big">${show(s.t)}</p>
    ${isFork(s) ? turnRows(steps, i) : `<p class="meta">${chosenLine(s)}</p>`}
    ${bar(s)}${shareRows(top)}${rest > 0 ? `<p class="meta">and ${rest} more</p>` : ""}
    ${cf ? `<p class="sec">without each person</p>${cf}` : ""}
    <p class="hint">Click the word for the full breakdown.</p>`};
}

// ---------- sidebar ----------
const side = $("side");
function openSide(title, html){ $("sideTitle").textContent = title; $("sideBody").innerHTML = html; $("sideBody").scrollTop = 0; side.classList.add("open"); side.setAttribute("aria-hidden", "false") }
function closeSide(){ side.classList.remove("open"); side.setAttribute("aria-hidden", "true"); clearInterval(traceTimer); document.querySelectorAll(".w.picked").forEach(w => w.classList.remove("picked")) }
$("sideClose").onclick = closeSide;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSide() });

function wordSide(a, steps, i){
  const s = steps[i], others = peopleOf(s.sh).filter(([u]) => u !== a.user_id);
  let h = `<p class="lbl">${isFork(s) ? "from memory · the path turned here" : "from memory"}</p><p class="big">${show(s.t)}</p>
    <p class="meta">${chosenLine(s)} ${s.open} word${s.open === 1 ? "" : "s"} held 95% of the odds here.</p>
    ${isFork(s) ? `<div style="margin-top:10px">${turnRows(steps, i)}</div>` : ""}
    ${bar(s)}${shareRows(sharesSorted(s))}
    <p class="meta" style="margin-top:6px">These shares are exact: the word's probability is a sum of the model's part and each stored text's part.</p>`;
  if (others.length) h += `<p class="flag quiet">Found by <b>${esc(a.user_id)}</b>: their question is what pulled ${others.map(([u]) => esc(u) + "'s").join(", ")} words off the shelf here.</p>`;
  if (s.weak) h += `<p class="flag">The closest stored text was far from this context (${s.near}× the typical distance). Retrieval matches by similarity, not by truth.</p>`;
  h += `<p class="sec">without each person</p>${cfRows(s, 0) || `<p class="meta">No one's removal changes this word.</p>`}<p class="meta">Same sentence so far, that person's texts removed, the rest re-searched.</p>`;
  h += `<p class="sec">stored texts it matched</p>${s.nb.length ? `<ul class="nb">${s.nb.map(n => {
    const tag = n.ok ? "Pointed to this word" : n.f ? `Pointed to “${show(n.v)}”, ruled out: the model alone didn't find it fluent here` : `Pointed to “${show(n.v)}” instead`;
    return `<li class="${n.ok ? "" : "other"}" style="--c:${ink(n.u)}"><span class="src">${esc(n.u)}</span><br>…${esc(n.b)}<mark>${esc(n.v)}</mark>${esc(n.a)}…<br><span class="meta">${tag}. Weight ${pct(n.w)}.</span></li>` }).join("")}</ul>` : `<p class="meta">The stream is empty.</p>`}`;
  h += `<p class="sec">top choices</p><table><tr><th>Model alone</th><th>With the stream</th></tr>${s.lm5.map((x, j) =>
    `<tr><td>${show(x[0])} <span class="meta">${pct(x[1])}</span></td><td>${show(s.fin5[j][0])} <span class="meta">${pct(s.fin5[j][1])}</span></td></tr>`).join("")}</table>`;
  if (S && S.trace_available) h += `<p class="sec">inside the model</p><p class="meta">An attribution graph shows which internal features led the untouched model toward this word. It covers the model's share only. It takes several minutes on a laptop.</p><div id="traceBox" style="margin-top:8px"><button class="btn" type="button" id="traceGo">Build the graph</button></div>`;
  openSide("word", h);
  const go = $("traceGo"); if (go) go.onclick = () => startTrace(a.query_id, i);
}

function traceState(job){
  const box = $("traceBox"); if (!box) return;
  if (job.status === "done") box.innerHTML = `<a class="btn solid" href="${esc(job.url)}" target="_blank" rel="noopener">Open the graph</a>`;
  else if (job.status === "error") box.innerHTML = `<p class="err">The graph failed: ${esc(job.error || "unknown error")}.</p>`;
  else box.innerHTML = `<p class="meta">${job.status === "queued" ? `Waiting in line (position ${job.queue_position}).` : `Building since ${new Date(job.started * 1000).toLocaleTimeString()}.`}</p>`;
}
async function startTrace(qid, pos){
  try{
    let job = await api("/api/trace", {method:"POST", body:JSON.stringify({query_id:qid, pos})}); traceState(job);
    clearInterval(traceTimer);
    traceTimer = setInterval(async () => {
      job = await api("/api/trace/" + job.slug); traceState(job);
      if (job.status === "done" || job.status === "error") clearInterval(traceTimer);
    }, 4000);
  }catch(e){ $("traceBox").innerHTML = `<p class="err">${esc(e.message)}</p>` }
}

function exchangeSide(a){
  const X = a.exchange, P = a.price;
  const subs = Object.entries(P.subsidy).sort((x,y) => y[1]-x[1]);
  const helped = subs.filter(([,v]) => v >= 0.05), hurt = subs.filter(([,v]) => v <= -0.05);
  let h = `<p class="lbl">market prices</p><p class="big">${(X.bought / X.spent).toFixed(1)}× return</p>
    <p class="meta">Your question cost <b>${fmt(X.spent)}</b> to reach. After it, this reply cost ${fmt(X.with)}; after an empty question, ${fmt(X.without)}. So it saved the reply <b>${fmt(X.bought)}</b>.</p>
    <p class="meta" style="margin-top:8px">In Babel this reply costs ${fmt(X.babel)}, whatever you ask. A question is a short address that works because human writing has already made most of the trip cheap. Each bit halves the odds.</p>
    <p class="sec">what your question cost</p>
    <table><tr><td>In Babel, every word equally likely</td><td>${fmt(P.babel)}</td></tr><tr><td>The model alone</td><td>${fmt(P.alone)}</td></tr>
      <tr><td>With the stream</td><td>${fmt(P.stream)}</td></tr><tr><td>With everyone's training</td><td>${fmt(P.weights)}</td></tr></table>
    <p class="sec">who lowered the price</p>`;
  h += helped.length ? `<ul class="shares">${helped.map(([u,v]) => `<li><span><span class="sw" style="--c:${ink(u)}"></span>${esc(u)}${u === a.user_id ? " (your own earlier words)" : ""}</span><span>saved ${fmt(v)}</span></li>`).join("")}</ul>`
    : `<p class="meta">No one in the stream made your question cheaper.</p>`;
  if (hurt.length) h += `<ul class="shares">${hurt.map(([u,v]) => `<li><span><span class="sw" style="--c:${ink(u)}"></span>${esc(u)}</span><span>added ${fmt(-v)}</span></li>`).join("")}</ul>`;
  openSide("market prices", h);
}

// ---------- taking a moment away on a USB stick ----------
async function momentSide(a){
  openSide("take this moment", `<p class="lbl">take this moment with you</p>
    <p class="meta">The stick won't hold the reply. It holds the reply's <b>address</b>: a few characters of the Library of Babel's alphabet that read back as exactly this reply, but only under the stream as it is right now. With the model alone, the same address reads as a different text. It also gets a copy of the stream and a page that opens offline on any computer.</p>
    <p class="sec">plug in a USB stick</p><div id="vols"><p class="meta">Looking for drives…</p></div>
    <p class="meta" style="margin-top:14px">No stick? <button class="linkbtn" type="button" id="dl">Download it instead</button></p>
    <div id="mOut" style="margin-top:14px"></div>`);
  const take = async volume => {
    $("mOut").innerHTML = `<p class="meta live">finding this reply's address</p>`;
    try{
      const r = await api("/api/moment", {method:"POST", body:JSON.stringify({query_id:a.query_id, volume})});
      $("mOut").innerHTML = `<p class="lbl">the address</p><p class="big" style="font-family:var(--mono);letter-spacing:.08em">${esc(r.address.replace(/ /g, "_"))}</p>
        <p class="meta">${r.address.length} characters, where Babel would need all ${r.babel_chars}. With the model alone it reads: “${esc(r.readings.alone.slice(0, 160))}…”</p>
        ${r.written_to ? `<p class="flag quiet">Written to <b>${esc(r.written_to)}</b>. Eject the stick before you pull it out.</p>` : ""}
        <p class="meta" style="margin-top:8px"><a href="${r.download}">Download a copy</a></p>`;
      if (volume === "") location.href = r.download;
    }catch(e){ $("mOut").innerHTML = `<p class="err">${esc(e.message)}</p>` }
  };
  $("dl").onclick = () => take("");
  const list = async () => {
    try{
      const vols = await api("/api/volumes");
      if (!$("vols")) return;
      $("vols").innerHTML = vols.length ? vols.map(v => `<button class="btn" type="button" data-v="${esc(v.name)}" style="margin:0 8px 8px 0">Write to ${esc(v.name)}</button>`).join("")
        : `<p class="meta">No stick found yet. Plug one in; it'll appear here.</p>`;
      $("vols").querySelectorAll("[data-v]").forEach(b => b.onclick = () => take(b.dataset.v));
    }catch(e){ $("vols").innerHTML = `<p class="err">${esc(e.message)}</p>` }
  };
  await list();
  // keep looking while the panel is open, so plugging a stick in shows it
  const t = setInterval(() => { if (!side.classList.contains("open") || $("sideTitle").textContent !== "take this moment") clearInterval(t); else if (!$("mOut").textContent) list() }, 2500);
}

function streamSide(){
  if (!S) return;
  const list = [...S.entries].reverse();
  openSide("stream", `<p class="meta">Everything people have said. Each message is stored in memory and trained into its author's part of the model. Removing one takes it out of memory at once and retrains that person's part from what's left.</p>
    <p class="err" id="streamErr"></p>
    <ul class="entries" style="margin-top:12px">${list.length ? list.map(e => `<li style="--c:${ink(e.user_id)}"><span class="src">${esc(e.user_id)}</span><p>${esc(e.text)}</p><button class="linkbtn" type="button" data-id="${e.entry_id}" data-who="${esc(e.user_id)}">Remove</button></li>`).join("")
      : `<li style="--c:var(--hair)"><span class="meta">Nothing yet.</span></li>`}</ul>`);
  $("sideBody").querySelectorAll("[data-id]").forEach(b => b.onclick = async () => {
    if (!confirm(`Remove this message by ${b.dataset.who}? It leaves memory at once; their part of the model is retrained from what's left.`)) return;
    b.textContent = "Removing and retraining…"; b.disabled = true;
    try{ S = await api("/api/entries/" + b.dataset.id, {method:"DELETE"}); streamSide() }catch(err){ $("streamErr").textContent = err.message; b.textContent = "Remove"; b.disabled = false }
  });
}
$("streamBtn").onclick = streamSide;

// ---------- a turn ----------
function askBox(name, text){
  const sec = document.createElement("section");
  sec.innerHTML = `<div class="ask"><span class="who mono">${esc(name)}</span><br><p>${esc(text)}</p><span class="status mono live">replying</span></div>`;
  return sec;
}

function renderReply(sec, a, n){
  const steps = a.memory.steps.map(fromApi);
  const reply = document.createElement("div"); reply.className = "reply";
  const text = document.createElement("p"); text.className = "text fresh";
  let k = 0;
  steps.forEach((s, i) => {
    s.t.split("\n").forEach((part, j) => {
      if (j) text.appendChild(document.createElement("br"));
      const shown = plain(part);
      if (!shown) return;
      if (!shown.trim()){ text.appendChild(document.createTextNode(shown)); return }   // indentation: no walls of its own
      const w = document.createElement("span"); w.className = "w"; w.dataset.i = i;
      w.dataset.word = shown; w.dataset.noise = noise(shown, n * 1000 + i);
      w.textContent = babel() ? w.dataset.noise : shown;
      w.style.setProperty("--wall", wall(s.open));
      w.style.setProperty("--mark", mark(s));
      w.style.setProperty("--k", k++);
      w.tabIndex = 0;
      if (j === 0 && isFork(s)){
        const notch = document.createElement("i"); notch.className = "notch"; notch.style.setProperty("--c", ink(peopleOf(s.sh)[0][0]));
        notch.setAttribute("aria-hidden", "true"); w.appendChild(notch); w.classList.add("fork");
        w.setAttribute("aria-label", `${shown}: the path turned here`);
      }
      text.appendChild(w);
    });
  });
  if (!k) text.textContent = "(The model stopped without writing anything.)";
  const hc = document.createElement("div"); hc.className = "hc"; hc.setAttribute("role", "status");
  reply.append(text, hc);

  const focus = w => {
    reply.querySelectorAll(".w.on").forEach(x => x.classList.remove("on"));
    hc.classList.remove("show");
    if (!w || babel()) return;
    w.classList.add("on");
    const {simple, html} = hoverCard(steps, +w.dataset.i);
    hc.className = "hc" + (simple ? " simple" : ""); hc.innerHTML = html; hc.classList.add("show");
    // Above the word, clear of its wall and notch; below it when there's no room above in the window.
    const r = w.getBoundingClientRect(), R = reply.getBoundingClientRect(), h = hc.offsetHeight;
    hc.style.left = Math.max(0, Math.min(r.left - R.left - 12, R.width - hc.offsetWidth)) + "px";
    const top = $("main").getBoundingClientRect().top;
    hc.style.top = (r.top - h - 26 > top ? r.top - R.top - h - 26 : r.bottom - R.top + 22) + "px";
  };
  const pick = w => {
    if (babel()) return;
    document.querySelectorAll(".w.picked").forEach(x => x.classList.remove("picked"));
    w.classList.add("picked");
    wordSide(a, steps, +w.dataset.i);
  };
  text.addEventListener("mouseover", e => { const w = e.target.closest(".w"); if (w) focus(w) });
  text.addEventListener("focusin", e => { const w = e.target.closest(".w"); if (w) focus(w) });
  text.addEventListener("click", e => { const w = e.target.closest(".w"); if (w){ focus(w); pick(w) } });
  text.addEventListener("keydown", e => { const w = e.target.closest(".w"); if (w && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); pick(w) } });
  reply.addEventListener("mouseleave", () => focus(null));

  // foot: one plain sentence (who shaped it, what the question cost and bought), then the user-trained response
  const foot = document.createElement("div"); foot.className = "foot";
  const X = a.exchange;
  const who = {}; steps.forEach(s => peopleOf(s.sh).forEach(([u,v]) => who[u] = (who[u] || 0) + v));
  const shaped = Object.entries(who).sort((x,y) => y[1]-x[1]);
  foot.innerHTML = `<p class="told">${shapedBy(shaped)}${X ? ` <button class="fare" type="button">${fareLine(X)}</button>` : ""}</p>
    <button class="linkish" type="button">see fully user-trained response</button>`;
  latest = a; $("takeBtn").hidden = false;
  const adapters = a.weights.adapters_at_time;
  const stripes = (adapters.length ? adapters : ["parametric"]).map((u,i) => `${ink(u)} ${i*4}px ${(i+1)*4}px`).join(",");
  const crowd = document.createElement("div"); crowd.className = "crowd"; crowd.hidden = true;
  crowd.innerHTML = `<span class="mono">fully user-trained response: ${adapters.length ? "everyone's training, averaged, so it can't be split by person" : "no one has written yet, so this is the untouched model"}</span><br><p style="--stripes:repeating-linear-gradient(90deg, ${stripes})">${esc(plain(a.weights.answer) || "(nothing)")}</p>`;
  const hear = foot.querySelector(".linkish");
  hear.onclick = () => { crowd.hidden = false; hear.remove() };
  if (X) foot.querySelector(".fare").onclick = () => exchangeSide(a);
  reply.append(foot, crowd);
  sec.appendChild(reply);
}

// The cost of a reply, said in a sentence rather than drawn as a dashboard.
const nameList = names => names.length > 1 ? names.slice(0, -1).join(", ") + " and " + names[names.length - 1] : names[0];
function shapedBy(shaped){
  if (!shaped.length) return "No one's words here, only the model's.";
  return `Shaped by ${nameList(shaped.map(([u]) => `<span class="nm" style="--c:${ink(u)}">${esc(u)}</span>`))}.`;
}
function fareLine(X){
  const spent = Math.round(X.spent), got = Math.round(Math.abs(X.bought));
  return `Your question cost ${spent} bits to ask, and made this reply ${got} bits ${X.bought >= 0 ? "easier" : "harder"} to find.`;
}
let latest = null;                                 // the newest reply, for "take this moment with you"

// ---------- sending ----------
// One message does both jobs: it is answered from the stream as it stands, then learned.
// Answering first keeps the reply from simply echoing the message back.
let turnNo = 0;
async function send(text){
  const name = $("name").value.trim();
  $("sendErr").textContent = "";
  if (!name){ showWho(); $("sendErr").textContent = "Add your name first."; $("name").focus(); return false }
  if (!$("consent").checked){ showWho(); $("sendErr").textContent = "Tick the box to confirm your messages can be stored, trained on, and shown to others."; return false }
  busy = true; autosize(); lastMsg = text; showAs();
  $("empty").hidden = true;
  const sec = askBox(name, text), status = sec.querySelector(".status");
  const setStatus = (m, live) => { status.textContent = m; status.classList.toggle("live", !!live) };
  const wait = document.createElement("p"); wait.className = "wait mono live"; wait.textContent = "writing";
  sec.appendChild(wait);
  $("log").appendChild(sec); sec.scrollIntoView({block:"start", behavior:"smooth"});
  try{
    const a = await api("/api/ask", {method:"POST", body:JSON.stringify({user_id:name, question:text})});
    wait.remove(); renderReply(sec, a, ++turnNo);
    setStatus("learning: storing your words, training your part of the model", true);
  }catch(e){
    wait.remove(); setStatus("no reply: " + e.message);
    busy = false; autosize(); return true;
  }
  try{
    S = await api("/api/ingest", {method:"POST", body:JSON.stringify({user_id:name, text, consent:true})});
    S.entries.forEach(e => ink(e.user_id));
    const tr = S.entries.find(e => e.entry_id === S.entry_id)?.training;
    setStatus(tr && tr.loss_start != null ? `learned · ${tr.steps} steps · ${tr.seconds ? Math.round(tr.seconds) + " s" : ""}` : "learned");
  }catch(e){ setStatus("not learned: " + e.message) }
  busy = false; autosize();
  return true;
}

// ---------- composer and identity ----------
const msg = $("msg");
function autosize(){ msg.style.height = "auto"; msg.style.height = Math.min(msg.scrollHeight, 160) + "px"; $("sendBtn").disabled = busy || !msg.value.trim() }
function showAs(){ if ($("name").value.trim() && $("consent").checked){ $("asName").textContent = $("name").value.trim(); $("asLine").hidden = false; $("whoRow").hidden = true } }
function showWho(){ $("asLine").hidden = true; $("whoRow").hidden = false }
$("change").onclick = () => { showWho(); $("name").focus() };
$("takeBtn").onclick = () => { if (latest) momentSide(latest) };

// ---------- speaking instead of typing ----------
// The browser's own speech recognition: words appear in the box as you speak, and you can edit them before sending.
// Chrome sends the audio to Google to transcribe, Safari to Apple; browsers without it simply don't show the mic.
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!Recognition) $("micBtn").hidden = true;
else {
  let rec = null;
  const mic = $("micBtn");
  const listening = on => { mic.setAttribute("aria-pressed", String(on)); mic.setAttribute("aria-label", on ? "Stop listening" : "Speak") };
  mic.onclick = () => {
    if (rec){ rec.stop(); return }
    $("sendErr").textContent = "";
    const before = msg.value.trim() ? msg.value.replace(/\s*$/, " ") : "";
    rec = new Recognition();
    rec.lang = navigator.language || "en-US";
    rec.interimResults = true;
    rec.continuous = true;
    rec.onresult = e => { msg.value = before + [...e.results].map(r => r[0].transcript).join(""); autosize() };
    rec.onerror = e => {
      $("sendErr").textContent = e.error === "not-allowed" || e.error === "service-not-allowed"
        ? "The microphone is blocked. Allow it for this page in the browser's site settings, then try again."
        : e.error === "no-speech" ? "Didn't hear anything. Try again a little closer to the microphone."
        : "Speech input stopped (" + e.error + "). You can type instead.";
    };
    rec.onend = () => { rec = null; listening(false); msg.focus() };
    rec.start(); listening(true);
  };
}
msg.addEventListener("input", autosize);
msg.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); $("composer").requestSubmit() }
  else if (e.key === "ArrowUp" && !msg.value && lastMsg){ e.preventDefault(); msg.value = lastMsg; autosize() }
});
$("composer").onsubmit = async e => {
  e.preventDefault();
  const text = msg.value.trim();
  if (!text || busy) return;
  msg.value = ""; autosize();
  if (!await send(text)){ msg.value = text; autosize() }
};
$("name").value = store.get("name") || "";
$("name").addEventListener("input", e => store.set("name", e.target.value));
$("consent").checked = store.get("consent") === "1";
$("consent").addEventListener("change", e => store.set("consent", e.target.checked ? "1" : "0"));
showAs();
if (matchMedia("(pointer:fine)").matches) msg.focus();

// ---------- the walls ----------
function babelLine(){
  const n = Math.max(0, ...[...document.querySelectorAll(".text")].map(t => new Set([...t.querySelectorAll(".w")].map(w => w.dataset.i)).size));
  return n ? `In Babel-space, every one of ${V.toLocaleString()} words is equally likely at each step. A reply of ${n} words becomes one of about 10<sup>${Math.round(n * Math.log10(V))}</sup> texts of its length, all equally likely, and none of them anyone's.`
    : `In Babel-space, every one of ${V.toLocaleString()} words is equally likely at each step, and every reply becomes noise that belongs to no one.`;
}
$("walls").onclick = e => {
  const on = !babel();
  document.body.classList.toggle("babel", on);
  e.currentTarget.setAttribute("aria-pressed", String(on));
  document.querySelectorAll(".w").forEach(w => w.firstChild.nodeValue = on ? w.dataset.noise : w.dataset.word);
  $("babelLine").hidden = !on; if (on) $("babelLine").innerHTML = babelLine();
  document.querySelectorAll(".hc").forEach(h => h.classList.remove("show"));
  closeSide();
};

api("/api/state").then(s => { S = s; V = s.vocab || V; s.entries.forEach(e => ink(e.user_id)) })
  .catch(() => { $("sendErr").textContent = "Can't reach the server. Is server.py running?" });
</script>
<script type="module">
// Design feedback: open the page with ?feedback to annotate the UI. "Send" saves to data/feedback.json for the next edit.
// Off by default so people using the piece never see the toolbar. Needs internet (React and Agentation load from esm.sh).
if (new URLSearchParams(location.search).has("feedback")){
  const [{createElement}, {createRoot}, {Agentation}] = await Promise.all([import("react"), import("react-dom/client"), import("agentation")]);
  const host = document.createElement("div"); host.id = "agentation-root"; document.body.appendChild(host);
  createRoot(host).render(createElement(Agentation, {
    appName: "whose-words",
    onSubmit: async (output, annotations) => {
      const r = await fetch("/api/feedback", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({output, annotations})});
      if (!r.ok) throw new Error("The server didn't save the feedback.");
    }
  }));
}
</script>
